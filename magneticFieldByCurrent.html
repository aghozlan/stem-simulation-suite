<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ahmad Ghozlan, M.S.">
    <title>Advanced Magnetic Fields & Laplace Force</title>

    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('consent', 'default', {
            'analytics_storage': 'denied',3.
            'ad_storage': 'denied',
            'ad_user_data': 'denied',
            'ad_personalization': 'denied'
        });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZLT3D41MC0"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-ZLT3D41MC0');
    </script>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script>
        function safeMathRender() {
            if (typeof window.MathJax !== 'undefined' && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(err => console.warn("MathJax formatting delayed.", err));
            }
        }
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --ui-bg: rgba(12, 18, 28, 0.9);
            --ui-border: rgba(0, 210, 255, 0.4);
            --text-main: #f8fafc;
            --accent: #00d2ff;
            --force: #ff0055;
            --b-field: #00d2ff;
            --current: #ffea00;
        }

        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #030508; color: var(--text-main); touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* HUD Toggle Button */
        #btnToggleUI {
            position: absolute; top: 20px; right: 20px; background: rgba(12, 18, 28, 0.8); backdrop-filter: blur(8px);
            border: 1px solid var(--accent); color: var(--accent); padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; z-index: 30; transition: all 0.3s;
        }
        #btnToggleUI:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }

        /* Main Dashboard */
        #dashboard {
            position: absolute; top: 20px; left: 20px; width: 400px; background: var(--ui-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--ui-border); border-radius: 12px; padding: 25px; z-index: 20; box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); max-height: 85vh; overflow-y: auto;
        }
        #dashboard.hidden { opacity: 0; transform: translateX(-450px); pointer-events: none; }

        /* Navigation Tabs */
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s;
        }
        .tab-btn.active { background: rgba(0, 210, 255, 0.2); border-color: var(--accent); color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        .tab-btn.full-width { grid-column: 1 / -1; background: rgba(255, 0, 85, 0.2); border-color: var(--force); color: #fff;}

        h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: #fff; }
        .formula-box { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 3px solid var(--accent); font-size: 1.1rem; text-align: center; }
        
        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; color: #cbd5e1; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; outline: none;}

        .legend { display: flex; gap: 15px; font-size: 0.8rem; margin-top: 20px; flex-wrap: wrap; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);}
        .legend span { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }

        #instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            padding: 12px 25px; border-radius: 30px; font-size: 0.9rem; color: #94a3b8; z-index: 10; pointer-events: none; display: flex; gap: 20px;
        }
        .key { color: var(--accent); font-weight: bold; }

        /* Consent Banner */
        #consent-banner {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px;
            background: rgba(15, 20, 28, 0.95); backdrop-filter: blur(10px); border: 1px solid var(--ui-border);
            border-radius: 12px; padding: 20px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; text-align: center;
        }
        #consent-banner.hidden { display: none; }
        .consent-btns { display: flex; justify-content: center; gap: 10px; }
        .btn-consent { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s;}
        .btn-accept { background: #00d2ff; color: #000; }
        .btn-accept:hover { box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
        .btn-decline { background: rgba(255, 255, 255, 0.1); color: #fff; }

        @media (max-width: 768px) {
            #dashboard { width: calc(100vw - 40px); top: 70px; }
            #btnToggleUI { top: 15px; right: 15px; }
            #instructions { bottom: 15px; font-size: 0.75rem; flex-direction: column; gap: 5px; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <button id="btnToggleUI">⚙️ Dashboard</button>

    <div id="dashboard">
        <div class="tabs" id="tabs"></div>
        <div id="ui-content"></div>

        <div class="legend">
            <span><div class="dot" style="background: var(--current)"></div> Current (I) / Thumb</span>
            <span><div class="dot" style="background: var(--b-field)"></div> B-Field (B) / Index</span>
            <span><div class="dot" style="background: var(--force)"></div> Force (F) / Middle</span>
        </div>
    </div>

    <div id="instructions">
        <span><span class="key">Drag</span> Magnets</span>
        <span><span class="key">Right Click</span> Orbit</span>
        <span><span class="key">Scroll</span> Zoom</span>
    </div>

    <div id="consent-banner">
        <p style="margin:0; color:#cbd5e1;">This educational laboratory uses anonymous analytics to count visitors. Do you accept the use of analytics cookies?</p>
        <div class="consent-btns">
            <button class="btn-consent btn-decline" id="btnDecline">Decline</button>
            <button class="btn-consent btn-accept" id="btnAccept">Accept</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Consent Logic ---
        document.addEventListener("DOMContentLoaded", () => {
            const banner = document.getElementById('consent-banner');
            const status = localStorage.getItem('analytics_consent');
            if (status === 'granted') { banner.classList.add('hidden'); gtag('consent', 'update', { 'analytics_storage': 'granted' }); } 
            else if (status === 'denied') { banner.classList.add('hidden'); }

            document.getElementById('btnAccept').addEventListener('click', () => {
                localStorage.setItem('analytics_consent', 'granted'); gtag('consent', 'update', { 'analytics_storage': 'granted' }); banner.classList.add('hidden');
            });
            document.getElementById('btnDecline').addEventListener('click', () => {
                localStorage.setItem('analytics_consent', 'denied'); banner.classList.add('hidden');
            });
        });

        // --- Core Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05080f, 0.012);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

        scene.add(new THREE.AmbientLight(0x444444, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(60, 60, 0x00d2ff, 0x112233);
        grid.position.y = -5; grid.material.opacity = 0.15; grid.material.transparent = true;
        scene.add(grid);

        // --- Shared Materials & Tools ---
        const matCopper = new THREE.MeshPhysicalMaterial({color: 0xc86a3a, metalness: 1, roughness: 0.2});
        const matN = new THREE.MeshStandardMaterial({color: 0xff0055, metalness: 0.3});
        const matS = new THREE.MeshStandardMaterial({color: 0x00d2ff, metalness: 0.3});
        
        function createArrow(dir, origin, length, hex) {
            return new THREE.ArrowHelper(dir, origin, length, hex, 0.2 * length, 0.1 * length);
        }

        // --- PROCEDURAL STATIC REFERENCE HAND ---
        function createStaticHand(pose) {
            const group = new THREE.Group();
            const matSkin = new THREE.MeshStandardMaterial({color: 0x4a5568, roughness: 0.8}); // Stylized dark glove
            const matI = new THREE.MeshBasicMaterial({color: 0xffea00}); // Thumb
            const matB = new THREE.MeshBasicMaterial({color: 0x00d2ff}); // Index/Curl
            const matF = new THREE.MeshBasicMaterial({color: 0xff0055}); // Middle

            const palm = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), matSkin);
            group.add(palm);

            const thumb = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5), matI);
            thumb.position.set(0, 1.25, 0); // Points UP (+Y)
            group.add(thumb);

            if(pose === 'curl') {
                // Curled fingers for B-field
                const curl = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.15, 8, 16, Math.PI * 1.2), matB);
                curl.rotation.x = Math.PI/2;
                curl.position.set(0.2, 0, 0.5);
                group.add(curl);
            } else if (pose === 'fbi') {
                // Index (B-field) points Right (+X)
                const index = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.5), matB);
                index.rotation.z = -Math.PI/2;
                index.position.set(0.75, 0.3, 0);
                group.add(index);
                // Middle (Force) points Forward (+Z)
                const middle = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.5), matF);
                middle.rotation.x = Math.PI/2;
                middle.position.set(0, 0, 0.75);
                group.add(middle);
            }
            return group;
        }

        // --- Interaction Globals ---
        let activeGroup = new THREE.Group();
        scene.add(activeGroup);
        let currentAnimation = null; 
        const uiContent = document.getElementById('ui-content');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let draggedObj = null;

        // Dragging Logic for Resultant Magnets
        window.addEventListener('pointerdown', (e) => {
            if(e.button !== 0) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(activeGroup.children, true);
            if(intersects.length > 0 && intersects[0].object.userData.draggable) {
                draggedObj = intersects[0].object.parent || intersects[0].object; 
                controls.enabled = false;
            }
        });
        window.addEventListener('pointermove', (e) => {
            if(!draggedObj) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const target = new THREE.Vector3();
            raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0), 0), target);
            if(target) { draggedObj.position.x = target.x; draggedObj.position.z = target.z; }
        });
        window.addEventListener('pointerup', () => { draggedObj = null; controls.enabled = true; });

        // --- LAB MODULES ---
        const modules = {
            resultant: {
                title: "1. Magnet Resultant",
                class: "tab-btn",
                init: () => {
                    uiContent.innerHTML = `
                        <h2>Resultant Field</h2>
                        <div class="formula-box">$$ \\vec{B}_{net} = \\vec{B}_1 + \\vec{B}_2 $$</div>
                        <p style="font-size: 0.85rem; color:#94a3b8;">Drag the magnets to see how their fields combine at the center origin.</p>
                    `;
                    safeMathRender();

                    const m1 = new THREE.Group(); m1.userData.draggable = true; m1.position.set(-6, 0, 0);
                    const p1N = new THREE.Mesh(new THREE.BoxGeometry(3,1,1), matN); p1N.position.x = 1.5; p1N.userData.draggable = true;
                    const p1S = new THREE.Mesh(new THREE.BoxGeometry(3,1,1), matS); p1S.position.x = -1.5; p1S.userData.draggable = true;
                    m1.add(p1N, p1S);

                    const m2 = new THREE.Group(); m2.userData.draggable = true; m2.position.set(0, 0, -6); m2.rotation.y = Math.PI/2;
                    const p2N = new THREE.Mesh(new THREE.BoxGeometry(3,1,1), matN); p2N.position.x = 1.5; p2N.userData.draggable = true;
                    const p2S = new THREE.Mesh(new THREE.BoxGeometry(3,1,1), matS); p2S.position.x = -1.5; p2S.userData.draggable = true;
                    m2.add(p2N, p2S);

                    activeGroup.add(m1, m2);

                    const centerMark = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xffffff}));
                    activeGroup.add(centerMark);

                    const vecB1 = createArrow(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 2, 0xffaa00);
                    const vecB2 = createArrow(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 2, 0xff00ff);
                    const vecBnet = createArrow(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 3, 0x00d2ff);
                    activeGroup.add(vecB1, vecB2, vecBnet);

                    currentAnimation = () => {
                        function getB(mGroup) {
                            const px = mGroup.position.x; const pz = mGroup.position.z;
                            const vN = new THREE.Vector3(-px, 0, -pz);
                            const dist = vN.lengthSq();
                            if(dist < 1) return new THREE.Vector3(0,0,0);
                            const dir = new THREE.Vector3(1,0,0).applyEuler(mGroup.rotation);
                            return dir.multiplyScalar(30 / Math.pow(dist, 1.5));
                        }
                        const b1 = getB(m1); const b2 = getB(m2);
                        const bNet = new THREE.Vector3().addVectors(b1, b2);

                        if(b1.length() > 0.1) { vecB1.setDirection(b1.clone().normalize()); vecB1.setLength(b1.length()); }
                        if(b2.length() > 0.1) { vecB2.setDirection(b2.clone().normalize()); vecB2.setLength(b2.length()); }
                        if(bNet.length() > 0.1) { vecBnet.setDirection(bNet.clone().normalize()); vecBnet.setLength(bNet.length(), 0.5, 0.3); }
                    };
                }
            },
            wire: {
                title: "2. Straight Wire",
                class: "tab-btn",
                init: () => {
                    uiContent.innerHTML = `
                        <h2>Straight Wire</h2>
                        <div class="formula-box">$$ B = \\frac{\\mu_0 I}{2\\pi r} $$</div>
                        <div class="control-group"><label>Current (I): <span id="valI">10 A (Up)</span></label><input type="range" id="slI" min="-20" max="20" value="10"></div>
                        <p style="font-size: 0.85rem; color:#94a3b8;">Notice the magnetic field rotates Anti-Clockwise when current goes Up.</p>
                    `;
                    safeMathRender();

                    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 30), matCopper);
                    activeGroup.add(wire);

                    const fieldRings = new THREE.Group();
                    for(let r=2; r<=6; r+=2) {
                        const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.05, 8, 32), new THREE.MeshBasicMaterial({color: 0x00d2ff}));
                        ring.rotation.x = Math.PI/2;
                        // Arrows point along the circle
                        const arr = createArrow(new THREE.Vector3(0,0,-1), new THREE.Vector3(r,0,0), 1.5, 0x00d2ff);
                        const arr2 = createArrow(new THREE.Vector3(0,0,1), new THREE.Vector3(-r,0,0), 1.5, 0x00d2ff);
                        ring.add(arr, arr2);
                        fieldRings.add(ring);
                    }
                    activeGroup.add(fieldRings);

                    const hand = createStaticHand('curl');
                    hand.position.set(4, -3, 0);
                    activeGroup.add(hand);

                    let I = 10;
                    document.getElementById('slI').addEventListener('input', e => { 
                        I = parseInt(e.target.value); 
                        document.getElementById('valI').textContent = `${Math.abs(I)} A (${I >= 0 ? 'Up' : 'Down'})`; 
                    });

                    currentAnimation = () => {
                        // Rotation: looking from top, positive is counter-clockwise.
                        const speed = I * 0.005;
                        fieldRings.rotation.y += speed;

                        // Static hand flips exactly when current reverses
                        if(I < 0) {
                            hand.rotation.z = Math.PI; // Thumb down
                        } else {
                            hand.rotation.z = 0; // Thumb up
                        }
                    };
                }
            },
            coil: {
                title: "3. Flat Coil",
                class: "tab-btn",
                init: () => {
                    uiContent.innerHTML = `
                        <h2>Flat Coil</h2>
                        <div class="formula-box">$$ B = \\frac{\\mu_0 N I}{2 R} $$</div>
                        <div class="control-group"><label>Turns (N): <span id="valN">5</span></label><input type="range" id="slN" min="1" max="10" value="5"></div>
                        <div class="control-group"><label>Current (I): <span id="valI">10 A</span></label><input type="range" id="slI" min="-20" max="20" value="10"></div>
                    `;
                    safeMathRender();

                    const coilGroup = new THREE.Group();
                    activeGroup.add(coilGroup);
                    
                    function buildCoil(turns) {
                        while(coilGroup.children.length > 0) coilGroup.remove(coilGroup.children[0]);
                        for(let i=0; i<turns; i++) {
                            const ring = new THREE.Mesh(new THREE.TorusGeometry(3, 0.15, 8, 64), matCopper);
                            ring.rotation.y = Math.PI/2; ring.position.x = (i - turns/2)*0.2;
                            coilGroup.add(ring);
                        }
                    }
                    
                    let N = 5; let I = 10;
                    buildCoil(N);

                    const vecB = createArrow(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 5, 0x00d2ff);
                    activeGroup.add(vecB);

                    const hand = createStaticHand('curl');
                    // Anchor hand to the top wire of the coil
                    hand.position.set(0, 3, 0);
                    
                    activeGroup.add(hand);

                    document.getElementById('slN').addEventListener('input', e => { N = parseInt(e.target.value); document.getElementById('valN').textContent = N; buildCoil(N); });
                    document.getElementById('slI').addEventListener('input', e => { I = parseInt(e.target.value); document.getElementById('valI').textContent = I + " A"; });

                    currentAnimation = () => {
                        const bMag = (N * Math.abs(I)) / 10;
                        if(bMag > 0.1) {
                            vecB.setDirection(new THREE.Vector3(Math.sign(I), 0, 0));
                            vecB.setLength(bMag, 1, 0.5);
                        } else { vecB.setLength(0.01); }

                        // Flip hand direction if current reverses
                        hand.rotation.set(0, 0, -Math.PI/2);
                        if (I < 0) { 
                        // Flips 180 degrees on the X-axis while keeping the thumb on the wire
                            hand.rotation.set(Math.PI, 0, -Math.PI/2); 
                        } else {
                            hand.rotation.set(0, 0, -Math.PI/2); } 
                    };
                }
            },
            solenoid: {
                title: "4. Solenoid",
                class: "tab-btn",
                init: () => {
                    uiContent.innerHTML = `
                        <h2>Solenoid</h2>
                        <div class="formula-box">$$ B = \\mu_0 n I $$</div>
                        <div class="control-group"><label>Turn Density (n): <span id="valN">10</span></label><input type="range" id="slN" min="5" max="20" value="10"></div>
                        <div class="control-group"><label>Current (I): <span id="valI">10 A</span></label><input type="range" id="slI" min="-20" max="20" value="10"></div>
                    `;
                    safeMathRender();

                    const solGroup = new THREE.Group();
                    activeGroup.add(solGroup);
                    let N = 10; let I = 10;

                    function buildSol(turns) {
                        while(solGroup.children.length > 0) { solGroup.children[0].geometry.dispose(); solGroup.remove(solGroup.children[0]); }
                        const points = [];
                        for(let i=0; i<=turns*40; i++) {
                            const t = i / (turns*40);
                            const angle = t * turns * Math.PI * 2;
                            const x = -5 + (t * 10);
                            points.push(new THREE.Vector3(x, Math.cos(angle)*2, Math.sin(angle)*2));
                        }
                        const curve = new THREE.CatmullRomCurve3(points);
                        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, turns*40, 0.15, 8, false), matCopper);
                        solGroup.add(tube);
                    }
                    buildSol(N);

                    const vecB = createArrow(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 6, 0x00d2ff);
                    activeGroup.add(vecB);

                    const hand = createStaticHand('curl');
                    // Anchor hand on the outside of the helix
                    hand.position.set(0, 0, 2);
                    hand.rotation.set(Math.PI/2, Math.PI/2, 0);
                    activeGroup.add(hand);

                    document.getElementById('slN').addEventListener('input', e => { N = parseInt(e.target.value); document.getElementById('valN').textContent = N; buildSol(N); });
                    document.getElementById('slI').addEventListener('input', e => { I = parseInt(e.target.value); document.getElementById('valI').textContent = I + " A"; });

                    currentAnimation = () => {
                        const bMag = (N * Math.abs(I)) / 20;
                        if(bMag > 0.1) {
                            vecB.setDirection(new THREE.Vector3(Math.sign(I), 0, 0));
                            vecB.setLength(bMag + 2, 1, 0.5);
                        } else { vecB.setLength(0.01); }

                        // Flip hand direction if current reverses
                        hand.rotation.set(0, 0, -Math.PI/2);
                        if (I < 0) {
                        // Flips 180 degrees on the X-axis for reverse current
                            hand.rotation.set(Math.PI/2 + Math.PI, Math.PI/2, 0); 
                        } else {
                            hand.rotation.set(Math.PI/2, Math.PI/2, 0); } 
                    };
                }
            },
            laplace: {
                title: "5. Laplace Force",
                class: "tab-btn full-width",
                init: () => {
                    uiContent.innerHTML = `
                        <h2>Lorentz Liquid Lab</h2>
                        <div class="formula-box">$$ \\vec{F} = I \\vec{\\ell} \\times \\vec{B} $$</div>
                        <div class="control-group"><label>Current (I): <span id="valI">Up</span></label><input type="range" id="slI" min="-1" max="1" value="1" step="2"></div>
                        <div class="control-group"><label>Magnets (B): <span id="valB">N Left, S Right</span></label><input type="range" id="slB" min="-1" max="1" value="1" step="2"></div>
                    `;
                    safeMathRender();

                    // The Conducting Liquid Beaker
                    const tank = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), new THREE.MeshPhysicalMaterial({color: 0x0066ff, transmission: 0.9, opacity: 1, transparent: true, roughness: 0.1}));
                    tank.position.y = -1.5;
                    activeGroup.add(tank);

                    // Magnets outside the beaker
                    const poleN = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matN);
                    const poleS = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matS);
                    activeGroup.add(poleN, poleS);

                    // Suspended Wire (Pivot from top)
                    const wirePivot = new THREE.Group();
                    wirePivot.position.y = 4; // Hanging point
                    activeGroup.add(wirePivot);
                    
                    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), matCopper);
                    wire.position.y = -3; // Drops into the beaker
                    wirePivot.add(wire);

                    // Static Hand Reference (FBI Rule)
                    const hand = createStaticHand('fbi');
                    hand.position.set(-3, 3, 0); // Floats above to show the vectors
                    activeGroup.add(hand);

                    // Vectors on the wire
                    const vGroup = new THREE.Group();
                    wirePivot.add(vGroup);
                    vGroup.position.y = -1.5; // middle of the magnetic field
                    const vecI = createArrow(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 3, 0xffea00);
                    const vecB = createArrow(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 3, 0x00d2ff);
                    const vecF = createArrow(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,0), 3, 0xff0055);
                    vGroup.add(vecI, vecB, vecF);

                    let I = 1; let B = 1; 
                    
                    document.getElementById('slI').addEventListener('input', e => { 
                        I = parseInt(e.target.value); 
                        document.getElementById('valI').textContent = I > 0 ? "Up (+)" : "Down (-)"; 
                    });
                    document.getElementById('slB').addEventListener('input', e => { 
                        B = parseInt(e.target.value); 
                        document.getElementById('valB').textContent = B > 0 ? "N Left, S Right" : "S Left, N Right"; 
                    });

                    currentAnimation = () => {
                        // Position Magnets based on B direction
                        poleN.position.set(B > 0 ? -3 : 3, -1.5, 0);
                        poleS.position.set(B > 0 ? 3 : -3, -1.5, 0);

                        // Physics Math: F = I x B.
                        // I is along Y axis (+Y if up). B is along X axis (+X if N left, S right).
                        // Y x X = -Z direction.
                        const fDir = -1 * I * B;

                        // Wire deflects (swings) in the Z axis based on Force
                        const targetSwing = fDir * 0.4; // max angle
                        wirePivot.rotation.x += (targetSwing - wirePivot.rotation.x) * 0.1; // Smooth easing

                        // Update Vectors
                        vecI.setDirection(new THREE.Vector3(0, I, 0));
                        vecB.setDirection(new THREE.Vector3(B, 0, 0));
                        vecF.setDirection(new THREE.Vector3(0, 0, fDir));

                        // Static Hand Setup: Base is Thumb=Y, Index=X, Middle=-Z
                        hand.rotation.set(0,0,0);
                        if(I < 0) {
                            hand.rotation.z = Math.PI; // Flip thumb down
                        }
                        if(B < 0) {
                            hand.rotation.y = Math.PI; // Flip index left
                            if(I < 0) hand.rotation.x = Math.PI; // Fix wrist twist
                        }
                    };
                }
            }
        };

        // --- Navigation Logic ---
        const tabsContainer = document.getElementById('tabs');
        Object.keys(modules).forEach(key => {
            const btn = document.createElement('button');
            btn.className = modules[key].class;
            btn.innerText = modules[key].title;
            btn.dataset.target = key;
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                scene.remove(activeGroup);
                activeGroup = new THREE.Group();
                scene.add(activeGroup);
                currentAnimation = null;
                camera.position.set(15, 12, 20);
                controls.target.set(0,0,0);
                modules[key].init();
            });
            tabsContainer.appendChild(btn);
        });

        // Initialize First Lab
        tabsContainer.firstChild.classList.add('active');
        modules['resultant'].init();

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if(currentAnimation) currentAnimation();
            renderer.render(scene, camera);
        }
        animate();

        // Dashboard Auto-hide logic for Mobile
        const dashboard = document.getElementById('dashboard');
        const btnToggleUI = document.getElementById('btnToggleUI');
        btnToggleUI.addEventListener('click', () => dashboard.classList.toggle('hidden'));
        window.addEventListener('pointerdown', (e) => {
            if (!dashboard.contains(e.target) && e.target !== btnToggleUI && window.innerWidth <= 768) {
                dashboard.classList.add('hidden');
            }
        });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
