<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ahmad Ghozlan, M.S.">
    <title>3D Electromagnetic Induction Lab</title>
    <style>
        :root {
            --ui-bg: rgba(20, 25, 35, 0.85);
            --ui-border: rgba(255, 255, 255, 0.1);
            --text-main: #e2e8f0;
            --accent: #4fd1c5;
        }

        body {
            margin: 0;
            overflow: hidden; /* Prevent scrolling, 3D canvas takes over */
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #050505;
            color: var(--text-main);
        }

        /* 3D Canvas */
        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* Floating UI Overlay (Glassmorphism) */
        #dashboard {
            position: absolute;
            top: 20px; left: 20px;
            width: 350px;
            background: var(--ui-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--ui-border);
            border-radius: 12px;
            padding: 20px;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        h1 { margin: 0 0 5px 0; font-size: 1.4rem; color: #ffffff; }
        p.subtitle { margin: 0 0 20px 0; font-size: 0.85rem; color: #a0aec0; }

        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; color: #cbd5e0;}
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button {
            flex: 1;
            padding: 10px;
            background: rgba(79, 209, 197, 0.2);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover { background: var(--accent); color: #1a202c; }
        button.active { background: var(--accent); color: #1a202c; }

        /* Graph Canvas */
        #graphCanvas {
            width: 100%; height: 180px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid var(--ui-border);
        }

        .legend { display: flex; justify-content: space-around; font-size: 0.8rem; margin-top: 10px;}
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Instructions HUD */
        #instructions {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #a0aec0;
            z-index: 10;
            pointer-events: none;
            display: flex; gap: 20px;
        }
        .key { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="dashboard">
        <h1>Faraday's Lab 3D</h1>
        <p class="subtitle">Interactive Physics Environment</p>

        <div class="control-group">
            <label>Coil Turns (N): <span id="turnsVal">5</span></label>
            <input type="range" id="turnsSlider" min="1" max="10" value="5">
        </div>
        <div class="control-group">
            <label>Magnet Strength (B): <span id="strengthVal">100%</span></label>
            <input type="range" id="strengthSlider" min="50" max="200" value="100">
        </div>

        <div class="btn-group">
            <button id="btnFlip">Flip Poles</button>
            <button id="btnAuto">Auto Oscillate</button>
        </div>

        <canvas id="graphCanvas" width="300" height="150"></canvas>
        <div class="legend">
            <span><div class="dot" style="background: #4fd1c5"></div> Flux (Φ)</span>
            <span><div class="dot" style="background: #fc8181"></div> EMF (ε)</span>
        </div>
    </div>

    <div id="instructions">
        <span><span class="key">Left Click + Drag</span> Magnet</span>
        <span><span class="key">Right Click</span> Orbit Camera</span>
        <span><span class="key">Scroll</span> Zoom</span>
    </div>

    <!-- Three.js Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. Three.js Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        // Map Right click to orbit, Left click to pan (we override left click for dragging)
        controls.mouseButtons = {
            LEFT: null, // Reserved for dragging magnet
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        // Lighting
        scene.add(new THREE.AmbientLight(0x404040, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Engineering Grid
        const gridHelper = new THREE.GridHelper(40, 40, 0x4fd1c5, 0x2d3748);
        gridHelper.position.y = -3;
        scene.add(gridHelper);

        // --- 2. Physics State ---
        let physics = {
            x: -8, lastX: -8, velocity: 0, flux: 0, emf: 0, smoothedEmf: 0,
            turns: 5, strength: 1.0, isNorthRight: true,
            isAuto: false, time: 0, isDragging: false
        };
        const coilRadius = 2.0;
        const dataHistory = new Array(150).fill({flux: 0, emf: 0});

        // --- 3. Object Creation ---

        // Dynamic Texture Generator for Magnet Labels
        function createLabelTexture(text, bgColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = 'white'; ctx.font = 'bold 120px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        const texN = createLabelTexture('N', '#e53e3e');
        const texS = createLabelTexture('S', '#3182ce');

        // Magnet Mesh
        const magnetGeo = new THREE.BoxGeometry(4, 1.5, 1.5);
        const matN = new THREE.MeshStandardMaterial({ map: texN, roughness: 0.4, metalness: 0.2 });
        const matS = new THREE.MeshStandardMaterial({ map: texS, roughness: 0.4, metalness: 0.2 });
        const matBlankN = new THREE.MeshStandardMaterial({ color: '#e53e3e', roughness: 0.4 });
        const matBlankS = new THREE.MeshStandardMaterial({ color: '#3182ce', roughness: 0.4 });
        
        // Assign materials to faces (Right, Left, Top, Bottom, Front, Back)
        const magnetMaterials = [matBlankN, matBlankS, matBlankN, matBlankS, matN, matBlankN];
        const magnet = new THREE.Mesh(magnetGeo, magnetMaterials);
        scene.add(magnet);

        // Solenoid (Coils)
        const coilGroup = new THREE.Group();
        const copperMat = new THREE.MeshPhysicalMaterial({
            color: 0xb87333, metalness: 1.0, roughness: 0.2, clearcoat: 1.0
        });
        
        function buildCoils() {
            // Clear existing
            while(coilGroup.children.length > 0){ 
                coilGroup.remove(coilGroup.children[0]); 
            }
            const spacing = 0.6;
            const startX = -((physics.turns - 1) * spacing) / 2;
            
            for(let i=0; i<physics.turns; i++) {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(coilRadius, 0.15, 16, 64), copperMat);
                ring.position.x = startX + (i * spacing);
                ring.rotation.y = Math.PI / 2;
                coilGroup.add(ring);
            }
        }
        scene.add(coilGroup);
        buildCoils();

        // Lightbulb
        const bulbGroup = new THREE.Group();
        bulbGroup.position.set(0, 4, -4);
        
        const glassGeo = new THREE.SphereGeometry(1, 32, 32);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, transmission: 0.9, opacity: 1, transparent: true,
            roughness: 0.1, ior: 1.5, emissive: 0xfaf089, emissiveIntensity: 0
        });
        const bulbMesh = new THREE.Mesh(glassGeo, glassMat);
        bulbGroup.add(bulbMesh);

        const bulbBase = new THREE.Mesh(
            new THREE.CylinderGeometry(0.4, 0.5, 0.8, 16),
            new THREE.MeshStandardMaterial({color: 0x718096, metalness: 0.8})
        );
        bulbBase.position.y = -1;
        bulbGroup.add(bulbBase);

        const bulbLight = new THREE.PointLight(0xfaf089, 0, 20);
        bulbGroup.add(bulbLight);
        scene.add(bulbGroup);

        // --- 4. Interaction (Raycasting & Dragging) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); // Invisible plane at z=0

        window.addEventListener('pointerdown', (event) => {
            if(physics.isAuto) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(magnet);
            
            if (intersects.length > 0) {
                physics.isDragging = true;
                controls.enabled = false; // Pause camera rotation
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (!physics.isDragging) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const target = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, target);
            
            if (target) {
                // Constrain to X axis
                magnet.position.x = Math.max(-15, Math.min(15, target.x));
            }
        });

        window.addEventListener('pointerup', () => {
            physics.isDragging = false;
            controls.enabled = true;
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 5. UI Event Listeners ---
        document.getElementById('turnsSlider').addEventListener('input', (e) => {
            physics.turns = parseInt(e.target.value);
            document.getElementById('turnsVal').textContent = physics.turns;
            buildCoils();
        });

        document.getElementById('strengthSlider').addEventListener('input', (e) => {
            physics.strength = parseInt(e.target.value) / 100;
            document.getElementById('strengthVal').textContent = e.target.value + '%';
        });

        document.getElementById('btnFlip').addEventListener('click', () => {
            physics.isNorthRight = !physics.isNorthRight;
            // Update materials based on polarity
            magnet.material = physics.isNorthRight ? 
                [matBlankN, matBlankS, matBlankN, matBlankS, matN, matBlankN] : 
                [matBlankS, matBlankN, matBlankS, matBlankN, matS, matBlankS];
        });

        const btnAuto = document.getElementById('btnAuto');
        btnAuto.addEventListener('click', () => {
            physics.isAuto = !physics.isAuto;
            btnAuto.classList.toggle('active');
            btnAuto.textContent = physics.isAuto ? "Stop Oscillator" : "Auto Oscillate";
            if(physics.isAuto) physics.time = Math.asin(magnet.position.x / 8) || 0;
        });

        // --- 6. Math & Physics Update ---
        let lastTimeMs = performance.now();
        const graphCtx = document.getElementById('graphCanvas').getContext('2d');

        function updatePhysics() {
            const now = performance.now();
            const dt = Math.max(0.001, (now - lastTimeMs) / 1000);
            lastTimeMs = now;

            // Handle Movement
            if (physics.isAuto) {
                physics.time += 2.0 * dt;
                magnet.position.x = 8 * Math.sin(physics.time);
            }

            // Calculate Velocity
            physics.velocity = (magnet.position.x - physics.lastX) / dt;
            physics.lastX = magnet.position.x;

            if(!physics.isAuto && !physics.isDragging) {
                physics.velocity *= 0.8; // Friction
            }

            // Dipole Flux calculation
            const x = magnet.position.x;
            const R2 = coilRadius * coilRadius;
            const distTerm = Math.pow(x*x + R2, 1.5);
            
            // Base flux
            let currentFlux = (R2 / distTerm) * physics.strength * 5;
            if (!physics.isNorthRight) currentFlux *= -1;

            // Derivative of Flux for EMF
            const dFlux_dx = (-3 * x * R2) / Math.pow(x*x + R2, 2.5);
            let rawEmf = -physics.turns * (dFlux_dx * physics.strength) * physics.velocity * 3;
            if (!physics.isNorthRight) rawEmf *= -1;

            physics.flux = currentFlux;
            physics.emf = rawEmf;
            physics.smoothedEmf += (physics.emf - physics.smoothedEmf) * 0.2;

            // Update Lightbulb Visuals
            const brightness = Math.min(1, Math.abs(physics.smoothedEmf) / 10);
            glassMat.emissiveIntensity = brightness * 2;
            bulbLight.intensity = brightness * 15;

            // Update Data History
            dataHistory.shift();
            dataHistory.push({ flux: physics.flux, emf: physics.emf });
        }

        // --- 7. Render 2D Graphs ---
        function drawGraphs() {
            const canvas = document.getElementById('graphCanvas');
            graphCtx.clearRect(0, 0, canvas.width, canvas.height);
            
            const w = canvas.width;
            const h = canvas.height;
            const midY = h / 2;

            // Zero line
            graphCtx.strokeStyle = 'rgba(255,255,255,0.2)';
            graphCtx.beginPath(); graphCtx.moveTo(0, midY); graphCtx.lineTo(w, midY); graphCtx.stroke();

            function plotData(key, color, scale) {
                graphCtx.beginPath();
                graphCtx.strokeStyle = color;
                graphCtx.lineWidth = 2;
                for(let i=0; i<dataHistory.length; i++) {
                    let xp = (i / dataHistory.length) * w;
                    let yp = midY - (dataHistory[i][key] * scale);
                    if(i===0) graphCtx.moveTo(xp, yp);
                    else graphCtx.lineTo(xp, yp);
                }
                graphCtx.stroke();
            }

            plotData('flux', '#4fd1c5', 10); // Teal
            plotData('emf', '#fc8181', 1.5); // Red
        }

        // --- 8. Main Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updatePhysics();
            drawGraphs();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
