    <style>
        :root {
            --ui-bg: rgba(15, 20, 28, 0.85);
            --ui-border: rgba(255, 255, 255, 0.15);
            --text-main: #e2e8f0;
            --accent: #00d2ff;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #050505;
            color: var(--text-main);
            touch-action: none; /* Prevents pull-to-refresh on mobile */
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* Floating HUD Button */
        #btnToggleUI {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(15, 20, 28, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        #btnToggleUI:hover { background: var(--accent); color: #000; }

        /* The Dashboard */
        #dashboard {
            position: absolute;
            top: 20px; left: 20px;
            width: 360px;
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--ui-border);
            border-radius: 16px;
            padding: 24px;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            /* Animation properties */
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: top left;
        }

        /* Hidden state for the dashboard */
        #dashboard.hidden {
            opacity: 0;
            transform: scale(0.95) translateY(-20px);
            pointer-events: none; /* Allows clicking through to the canvas */
        }

        h1 { margin: 0 0 5px 0; font-size: 1.5rem; color: #ffffff; letter-spacing: 0.5px; }
        p.subtitle { margin: 0 0 20px 0; font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }

        .control-group { margin-bottom: 18px; }
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; color: #cbd5e1; font-weight: 500;}
        input[type="range"] { 
            width: 100%; 
            accent-color: var(--accent); 
            cursor: pointer; 
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            outline: none;
        }

        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        button.action-btn {
            flex: 1;
            padding: 12px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        button.action-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
        button.action-btn.active { background: var(--accent); color: #000; }

        #graphCanvas {
            width: 100%; height: 160px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid var(--ui-border);
        }

        .legend { display: flex; justify-content: space-around; font-size: 0.8rem; margin-top: 12px; color: #cbd5e1;}
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }

        #instructions {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 20, 28, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid var(--ui-border);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #94a3b8;
            z-index: 10;
            pointer-events: none;
            display: flex; gap: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            white-space: nowrap;
        }
        .key { color: var(--accent); font-weight: bold; }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            #dashboard {
                width: calc(100vw - 40px); /* Fill most of the screen width */
                max-width: 400px;
                padding: 15px;
                top: 70px; /* Move below the toggle button */
            }
            #btnToggleUI {
                top: 15px; right: 15px;
            }
            #instructions {
                bottom: 15px;
                padding: 8px 15px;
                font-size: 0.75rem;
                gap: 10px;
            }
            #graphCanvas {
                height: 120px; /* Smaller graph on mobile */
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <button id="btnToggleUI">⚙️ HUD</button>

    <div id="dashboard">
        <h1>Closed Circuit Lab</h1>
        <p class="subtitle">Inducing current in a continuous loop via the spatial derivative of magnetic flux.</p>

        <div class="control-group">
            <label>Coil Turns (N): <span id="turnsVal">5</span></label>
            <input type="range" id="turnsSlider" min="2" max="12" value="5">
        </div>
        <div class="control-group">
            <label>Magnet Strength (B): <span id="strengthVal">100%</span></label>
            <input type="range" id="strengthSlider" min="50" max="200" value="100">
        </div>

        <div class="btn-group">
            <button class="action-btn" id="btnFlip">Flip Poles</button>
            <button class="action-btn" id="btnAuto">Oscillator</button>
        </div>

        <canvas id="graphCanvas" width="300" height="150"></canvas>
        <div class="legend">
            <span><div class="dot" style="background: #00d2ff"></div> Flux (Φ)</span>
            <span><div class="dot" style="background: #ff0055"></div> EMF (ε)</span>
        </div>
    </div>

    <div id="instructions">
        <span><span class="key">Drag</span> Magnet</span>
        <span><span class="key">Touch</span> Orbit Camera</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- UI Logic (Smart Dashboard) ---
        const dashboard = document.getElementById('dashboard');
        const btnToggleUI = document.getElementById('btnToggleUI');

        btnToggleUI.addEventListener('click', () => {
            dashboard.classList.toggle('hidden');
        });

        // Auto-hide dashboard when interacting with the 3D canvas (especially useful for mobile)
        window.addEventListener('pointerdown', (e) => {
            // Only hide if the click is OUTSIDE the dashboard and NOT on the toggle button
            if (!dashboard.contains(e.target) && e.target !== btnToggleUI) {
                // If on a smaller screen, auto-hide is very helpful
                if (window.innerWidth <= 768 && !dashboard.classList.contains('hidden')) {
                    dashboard.classList.add('hidden');
                }
            }
        });

        // --- 1. Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        // Adjust for mobile touch (1 finger orbit, 2 finger zoom)
        controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

        // Lighting
        scene.add(new THREE.AmbientLight(0x202020, 2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        
        const blueFill = new THREE.PointLight(0x3a7bd5, 1, 30);
        blueFill.position.set(-10, -5, 10);
        scene.add(blueFill);

        // Environment Details
        const gridHelper = new THREE.GridHelper(50, 50, 0x00d2ff, 0x111111);
        gridHelper.position.y = -6;
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // --- 2. Physics Engine State ---
        let physics = {
            velocity: 0, flux: 0, emf: 0, smoothedEmf: 0,
            turns: 5, strength: 1.0, isNorthRight: true,
            isAuto: false, time: 0, isDragging: false
        };
        let lastMagnetX = -10;
        const coilRadius = 2.5;
        const dataHistory = new Array(150).fill({flux: 0, emf: 0});
        let circuitCurve = null; 

        // --- 3. Object Creation ---
        function createLabelTexture(text, bgColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = 'white'; ctx.font = 'bold 140px "Segoe UI", Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        const magnetGroup = new THREE.Group();
        magnetGroup.position.x = -10;
        scene.add(magnetGroup);

        const halfGeo = new THREE.BoxGeometry(2.5, 1.8, 1.8); 
        
        const texN = createLabelTexture('N', '#ff0055');
        const texS = createLabelTexture('S', '#00d2ff');

        const matBlankN = new THREE.MeshStandardMaterial({ color: '#ff0055', roughness: 0.3, metalness: 0.4 });
        const matBlankS = new THREE.MeshStandardMaterial({ color: '#00d2ff', roughness: 0.3, metalness: 0.4 });
        const matLabelN = new THREE.MeshStandardMaterial({ map: texN, roughness: 0.3, metalness: 0.4 });
        const matLabelS = new THREE.MeshStandardMaterial({ map: texS, roughness: 0.3, metalness: 0.4 });

        const meshN = new THREE.Mesh(halfGeo, [matBlankN, matBlankN, matBlankN, matBlankN, matLabelN, matBlankN]);
        meshN.position.x = 1.25; 
        magnetGroup.add(meshN);

        const meshS = new THREE.Mesh(halfGeo, [matBlankS, matBlankS, matBlankS, matBlankS, matLabelS, matBlankS]);
        meshS.position.x = -1.25;
        magnetGroup.add(meshS);

        const circuitGroup = new THREE.Group();
        scene.add(circuitGroup);

        const copperMat = new THREE.MeshPhysicalMaterial({
            color: 0xc86a3a, metalness: 1.0, roughness: 0.2, clearcoat: 0.8
        });

        const electronGroup = new THREE.Group();
        scene.add(electronGroup);
        const electrons = [];
        const numElectrons = 60;
        const electronMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
        const electronGeo = new THREE.SphereGeometry(0.15, 8, 8);

        for(let i=0; i<numElectrons; i++) {
            const el = new THREE.Mesh(electronGeo, electronMat);
            electrons.push({ mesh: el, progress: i / numElectrons });
            electronGroup.add(el);
        }

        // The Lightbulb
        const bulbGroup = new THREE.Group();
        const bulbPos = new THREE.Vector3(0, -4.5, 5);
        bulbGroup.position.copy(bulbPos);
        
        const glassGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, transmission: 0.95, opacity: 1, transparent: true,
            roughness: 0.05, ior: 1.5, emissive: 0xffea00, emissiveIntensity: 0
        });
        const bulbMesh = new THREE.Mesh(glassGeo, glassMat);
        bulbGroup.add(bulbMesh);

        const bulbBase = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.6, 1, 32),
            new THREE.MeshStandardMaterial({color: 0x555555, metalness: 0.9, roughness: 0.4})
        );
        bulbBase.position.y = -1.2;
        bulbGroup.add(bulbBase);

        const bulbLight = new THREE.PointLight(0xffea00, 0, 25);
        bulbGroup.add(bulbLight);
        scene.add(bulbGroup);

        function buildCircuit() {
            while(circuitGroup.children.length > 0) {
                circuitGroup.children[0].geometry.dispose();
                circuitGroup.remove(circuitGroup.children[0]);
            }

            const points = [];
            const turns = physics.turns;
            const length = turns * 1.2; 
            const startX = -length / 2;

            points.push(new THREE.Vector3(bulbPos.x - 0.6, bulbPos.y - 1.5, bulbPos.z)); 
            points.push(new THREE.Vector3(startX - 2, bulbPos.y - 1.5, bulbPos.z)); 
            points.push(new THREE.Vector3(startX - 2, bulbPos.y - 1.5, -coilRadius)); 
            points.push(new THREE.Vector3(startX - 2, 0, -coilRadius)); 
            points.push(new THREE.Vector3(startX, 0, -coilRadius)); 
            
            const helixResolution = turns * 40;
            for (let i = 1; i <= helixResolution; i++) { 
                const t = i / helixResolution;
                const angle = t * turns * Math.PI * 2;
                const x = startX + (t * length);
                const y = Math.cos(angle - Math.PI/2) * coilRadius;
                const z = Math.sin(angle - Math.PI/2) * coilRadius;
                points.push(new THREE.Vector3(x, y, z));
            }

            points.push(new THREE.Vector3(startX + length + 2, 0, -coilRadius));
            points.push(new THREE.Vector3(startX + length + 2, bulbPos.y - 1.5, -coilRadius));
            points.push(new THREE.Vector3(startX + length + 2, bulbPos.y - 1.5, bulbPos.z));
            points.push(new THREE.Vector3(bulbPos.x + 0.6, bulbPos.y - 1.5, bulbPos.z));

            circuitCurve = new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.5);

            const tubeGeo = new THREE.TubeGeometry(circuitCurve, 200, 0.15, 12, true);
            const wireMesh = new THREE.Mesh(tubeGeo, copperMat);
            circuitGroup.add(wireMesh);
        }
        buildCircuit();

        // --- 4. Interactions ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        window.addEventListener('pointerdown', (event) => {
            if(physics.isAuto) return; 
            
            // For mobile compatibility, we handle touch events directly if they target the canvas
            if(event.pointerType !== 'mouse' && event.target !== renderer.domElement) return;
            if(event.pointerType === 'mouse' && event.button !== 0) return; 
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.intersectObject(magnetGroup, true).length > 0) {
                physics.isDragging = true;
                controls.enabled = false;
            }
        });

        window.addEventListener('pointermove', (event) => {
            if (!physics.isDragging) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const target = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, target);
            if (target) magnetGroup.position.x = Math.max(-18, Math.min(18, target.x));
        });

        window.addEventListener('pointerup', () => {
            physics.isDragging = false;
            controls.enabled = true;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Binding
        document.getElementById('turnsSlider').addEventListener('input', (e) => {
            physics.turns = parseInt(e.target.value);
            document.getElementById('turnsVal').textContent = physics.turns;
            buildCircuit();
        });

        document.getElementById('strengthSlider').addEventListener('input', (e) => {
            physics.strength = parseInt(e.target.value) / 100;
            document.getElementById('strengthVal').textContent = e.target.value + '%';
        });

        document.getElementById('btnFlip').addEventListener('click', () => {
            physics.isNorthRight = !physics.isNorthRight;
            meshN.position.x = physics.isNorthRight ? 1.25 : -1.25;
            meshS.position.x = physics.isNorthRight ? -1.25 : 1.25;
        });

        const btnAuto = document.getElementById('btnAuto');
        btnAuto.addEventListener('click', () => {
            physics.isAuto = !physics.isAuto;
            btnAuto.classList.toggle('active');
            if(physics.isAuto) physics.time = Math.asin(magnetGroup.position.x / 10) || 0;
        });

        // --- 5. Math & Physics Update ---
        let lastTimeMs = performance.now();
        const graphCtx = document.getElementById('graphCanvas').getContext('2d');

        function updatePhysics() {
            const now = performance.now();
            const dt = Math.max(0.001, (now - lastTimeMs) / 1000);
            lastTimeMs = now;

            if (physics.isAuto) {
                physics.time += 2.5 * dt;
                magnetGroup.position.x = 10 * Math.sin(physics.time);
            }

            physics.velocity = (magnetGroup.position.x - lastMagnetX) / dt;
            lastMagnetX = magnetGroup.position.x;
            if(!physics.isAuto && !physics.isDragging) physics.velocity *= 0.85;

            const x = magnetGroup.position.x;
            const R2 = coilRadius * coilRadius;
            const distTerm = Math.pow(x*x + R2, 1.5);
            
            let currentFlux = (R2 / distTerm) * physics.strength * 8;
            if (!physics.isNorthRight) currentFlux *= -1;

            const dFlux_dx = (-3 * x * R2) / Math.pow(x*x + R2, 2.5);
            let rawEmf = -physics.turns * (dFlux_dx * physics.strength) * physics.velocity * 5;
            if (!physics.isNorthRight) rawEmf *= -1;

            physics.flux = currentFlux;
            physics.emf = rawEmf;
            physics.smoothedEmf += (physics.emf - physics.smoothedEmf) * 0.2;

            const brightness = Math.min(1, Math.abs(physics.smoothedEmf) / 12);
            glassMat.emissiveIntensity = brightness * 2.5;
            bulbLight.intensity = brightness * 30;

            if(circuitCurve) {
                const flowSpeed = physics.smoothedEmf * 0.05 * dt; 
                electrons.forEach(el => {
                    el.progress += flowSpeed;
                    if(el.progress > 1) el.progress -= 1;
                    if(el.progress < 0) el.progress += 1;
                    
                    const pos = circuitCurve.getPointAt(el.progress);
                    el.mesh.position.copy(pos);
                    el.mesh.scale.setScalar(brightness > 0.02 ? 1 : 0);
                });
            }

            dataHistory.shift();
            dataHistory.push({ flux: physics.flux, emf: physics.emf });
        }

        // --- 6. Rendering & Graphs ---
        function drawGraphs() {
            const canvas = document.getElementById('graphCanvas');
            graphCtx.clearRect(0, 0, canvas.width, canvas.height);
            
            const w = canvas.width;
            const h = canvas.height;
            const midY = h / 2;

            graphCtx.strokeStyle = 'rgba(255,255,255,0.15)';
            graphCtx.beginPath(); graphCtx.moveTo(0, midY); graphCtx.lineTo(w, midY); graphCtx.stroke();

            function plotData(key, color, scale) {
                graphCtx.beginPath();
                graphCtx.strokeStyle = color;
                graphCtx.lineWidth = 2.5;
                graphCtx.lineJoin = 'round';
                for(let i=0; i<dataHistory.length; i++) {
                    let xp = (i / dataHistory.length) * w;
                    let yp = midY - (dataHistory[i][key] * scale);
                    if(i===0) graphCtx.moveTo(xp, yp);
                    else graphCtx.lineTo(xp, yp);
                }
                graphCtx.stroke();
            }

            plotData('flux', '#00d2ff', 12); 
            plotData('emf', '#ff0055', 1.5); 
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updatePhysics();
            drawGraphs();
            renderer.render(scene, camera);
        }
        animate();
    </script>
    <style>
        #consent-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(15, 20, 28, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;

        #consent-banner p {

            background: rgba(255, 255, 255, 0.2);

    <div id="consent-banner">
        <p>This educational laboratory uses anonymous analytics to count visitors and improve performance. Do you accept the use of analytics cookies?</p>
        <div class="consent-btns">
            <button class="btn-consent btn-decline" id="btnDecline">Decline</button>
            <button class="btn-consent btn-accept" id="btnAccept">Accept</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const banner = document.getElementById('consent-banner');
            const btnAccept = document.getElementById('btnAccept');
            const btnDecline = document.getElementById('btnDecline');

            // Check if the user already made a choice in the past
            const consentStatus = localStorage.getItem('analytics_consent');
            
            if (consentStatus === 'granted') {
                banner.classList.add('hidden');
                gtag('consent', 'update', { 'analytics_storage': 'granted' });
            } else if (consentStatus === 'denied') {
                banner.classList.add('hidden');
                // Remains denied as set in the head
            }

            // Handle Accept
            btnAccept.addEventListener('click', function() {
                localStorage.setItem('analytics_consent', 'granted');
                gtag('consent', 'update', { 'analytics_storage': 'granted' });
                banner.classList.add('hidden');
            });

            // Handle Decline
            btnDecline.addEventListener('click', function() {
                localStorage.setItem('analytics_consent', 'denied');
                banner.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
