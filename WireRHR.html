<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ahmad Ghozlan, M.S.">
    <title>Advanced Magnetic Fields & Laplace Force</title>

    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('consent', 'default', { 'analytics_storage': 'denied' });
    </script>
    <script async ="https://www.googletagmanager.com/gtag/js?id=G-ZLT3D41MC0"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-ZLT3D41MC0');
    </script>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script>
        function safeMathRender() {
            if (typeof window.MathJax !== 'undefined' && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise().catch(e => console.warn(e));
            }
        }
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --ui-bg: rgba(12, 18, 28, 0.9);
            --accent: #00d2ff;
            --force: #ff0055;
            --current: #ffea00;
        }

        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #030508; color: #fff; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* Dashboard */
        #dashboard {
            position: absolute; top: 20px; left: 20px; width: 400px; background: var(--ui-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--accent); border-radius: 12px; padding: 25px; z-index: 20; box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            max-height: 90vh; overflow-y: auto;
        }
        
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .tab-btn { padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: rgba(0, 210, 255, 0.2); border-color: var(--accent); color: #fff; }
        
        /* Switch Button */
        #switchBtn {
            width: 100%; padding: 15px; background: rgba(0, 210, 255, 0.1); border: 2px solid var(--accent);
            color: var(--accent); border-radius: 8px; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin-bottom: 20px;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
        }
        #switchBtn:hover { background: rgba(0, 210, 255, 0.3); }
        #switchBtn.active { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); border-color: #fff; }

        h2 { margin: 0 0 10px 0; font-size: 1.4rem; }
        .formula-box { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 3px solid var(--accent); text-align: center; }
        
        .control-group { margin-bottom: 15px; }
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px; color: #cbd5e1; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        .legend { display: flex; gap: 15px; font-size: 0.8rem; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Real Hand UI Overlay */
        #hand-reference-container {
            position: absolute; bottom: 30px; right: 30px; width: 250px; height: 250px; z-index: 20;
            background: rgba(0, 0, 0, 0.5); border: 2px dashed rgba(0, 210, 255, 0.3); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; flex-direction: column; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #hand-reference-container.hidden { opacity: 0; transform: scale(0.8); }
        #real-hand-img { max-width: 90%; max-height: 90%; object-fit: contain; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        #hand-label { position: absolute; bottom: -25px; font-size: 0.8rem; color: var(--accent); font-weight: bold; text-align: center; width: 100%;}

        /* Consent Banner */
        #consent-banner {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px;
            background: rgba(15, 20, 28, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px; padding: 20px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 15px; text-align: center;
        }
        #consent-banner.hidden { display: none; }
        .consent-btns { display: flex; justify-content: center; gap: 10px; }
        .btn-consent { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s;}
        .btn-accept { background: #00d2ff; color: #000; }
        .btn-accept:hover { box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
        .btn-decline { background: rgba(255, 255, 255, 0.1); color: #fff; }

        @media (max-width: 768px) { #dashboard { width: calc(100vw - 40px); top: 15px; left: 20px; } }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="dashboard">
        <div class="tabs" id="tabs">
            <button class="tab-btn active" data-target="wire">1. Straight Wire</button>
            <button class="tab-btn" data-target="laplace">2. Laplace Force</button>
        </div>
        <div id="ui-content"></div>

        <div class="legend">
            <span><div class="dot" style="background: var(--current)"></div> Current (I)</span>
            <span><div class="dot" style="background: var(--accent)"></div> B-Field (B)</span>
            <span><div class="dot" style="background: var(--force)"></div> Force (F)</span>
        </div>
    </div>

    <div id="hand-reference-container">
        <img id="real-hand-img" src="https://raw.githubusercontent.com/aghozlan/stem-simulation-suite/main/licensed-image.jpg
" alt="Right Hand Rule">
        <div id="hand-label">Right Hand Reference</div>
    </div>

    <div id="consent-banner">
        <p style="margin:0; color:#cbd5e1;">This educational laboratory uses anonymous analytics to count visitors. Do you accept the use of analytics cookies?</p>
        <div class="consent-btns">
            <button class="btn-consent btn-decline" id="btnDecline">Decline</button>
            <button class="btn-consent btn-accept" id="btnAccept">Accept</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Consent Logic ---
        document.addEventListener("DOMContentLoaded", () => {
            const banner = document.getElementById('consent-banner');
            const status = localStorage.getItem('analytics_consent');
            if (status === 'granted') { banner.classList.add('hidden'); gtag('consent', 'update', { 'analytics_storage': 'granted' }); } 
            else if (status === 'denied') { banner.classList.add('hidden'); }

            document.getElementById('btnAccept').addEventListener('click', () => {
                localStorage.setItem('analytics_consent', 'granted'); gtag('consent', 'update', { 'analytics_storage': 'granted' }); banner.classList.add('hidden');
            });
            document.getElementById('btnDecline').addEventListener('click', () => {
                localStorage.setItem('analytics_consent', 'denied'); banner.classList.add('hidden');
            });
        });

        // --- Core Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05080f, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0x444444, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(60, 60, 0x00d2ff, 0x112233);
        grid.position.y = -7.25; grid.material.opacity = 0.15; grid.material.transparent = true;
        scene.add(grid);

        const matCopper = new THREE.MeshPhysicalMaterial({color: 0xc86a3a, metalness: 1, roughness: 0.2});
        const matN = new THREE.MeshStandardMaterial({color: 0xff0055, metalness: 0.3});
        const matS = new THREE.MeshStandardMaterial({color: 0x00d2ff, metalness: 0.3});
        
        function createArrow(dir, origin, length, hex) {
            return new THREE.ArrowHelper(dir, origin, length, hex, 0.2 * length, 0.1 * length);
        }

        let activeGroup = new THREE.Group();
        scene.add(activeGroup);
        let currentAnimation = null; 
        const uiContent = document.getElementById('ui-content');
        const handUI = document.getElementById('hand-reference-container');
        const handImg = document.getElementById('real-hand-img');

        // --- LAB MODULES ---
        const modules = {
            wire: {
                init: () => {
                    uiContent.innerHTML = `
                        <h2>Straight Wire Circuit</h2>
                        <div class="formula-box">$$ B = \\frac{\\mu_0 I}{2\\pi r} $$</div>
                        <button id="switchBtn">SWITCH IS OPEN</button>
                        <div class="control-group"><label>Current (I): <span id="valI">10 A (Up)</span></label><input type="range" id="slI" min="-20" max="20" value="10"></div>
                        <p style="font-size: 0.85rem; color:#94a3b8;">Click the switch to close the 3D circuit and generate the magnetic field.</p>
                    `;
                    safeMathRender();
                    handUI.classList.remove('hidden');

                    let switchClosed = false;
                    const switchBtn = document.getElementById('switchBtn');

                    // 1. Dry Cell (Battery)
                    const battery = new THREE.Group();
                    battery.position.set(0, -6, 0);
                    const batBody = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 2.5, 32), new THREE.MeshStandardMaterial({color: 0x222222}));
                    const posTerminal = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 32), new THREE.MeshStandardMaterial({color: 0xff0055})); // Red Positive
                    posTerminal.position.y = 1.4;
                    battery.add(batBody, posTerminal);
                    activeGroup.add(battery);

                    // 2. Full 3D Circuit Loop
                    // Main Vertical Wire (for magnetic field)
                    const wireMain = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 14.6), matCopper);
                    wireMain.position.set(0, 2.7, 0); // From y=-4.6 to y=10
                    activeGroup.add(wireMain);

                    // Top Wire
                    const wireTop = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6), matCopper);
                    wireTop.rotation.z = Math.PI / 2;
                    wireTop.position.set(3, 10, 0);
                    activeGroup.add(wireTop);

                    // Return Vertical Wire
                    const wireReturn = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 17.25), matCopper);
                    wireReturn.position.set(6, 1.375, 0); // From y=10 to y=-7.25
                    activeGroup.add(wireReturn);

                    // Bottom Wire (Return to switch)
                    const wireBot1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3), matCopper);
                    wireBot1.rotation.z = Math.PI / 2;
                    wireBot1.position.set(4.5, -7.25, 0);
                    activeGroup.add(wireBot1);

                    // Bottom Wire (Battery to switch)
                    const wireBot2 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), matCopper);
                    wireBot2.rotation.z = Math.PI / 2;
                    wireBot2.position.set(0.5, -7.25, 0);
                    activeGroup.add(wireBot2);

                    // 3. Physical 3D Knife Switch
                    const switchGroup = new THREE.Group();
                    switchGroup.position.set(3, -7.25, 0);
                    activeGroup.add(switchGroup);

                    const switchPost1 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.5), new THREE.MeshStandardMaterial({color: 0x333333}));
                    switchPost1.rotation.x = Math.PI/2;
                    switchGroup.add(switchPost1);
                    
                    const switchPost2 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.5), new THREE.MeshStandardMaterial({color: 0x333333}));
                    switchPost2.rotation.x = Math.PI/2;
                    switchPost2.position.set(-2, 0, 0);
                    switchGroup.add(switchPost2);

                    // Switch Arm Pivot
                    const armPivot = new THREE.Group();
                    switchGroup.add(armPivot);
                    const switchArm = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.2, 0.4), matCopper);
                    switchArm.position.set(-1, 0.2, 0);
                    armPivot.add(switchArm);
                    
                    // Start Open (Angled up)
                    armPivot.rotation.z = Math.PI / 4;

                    // 4. Glowing Charge Particles
                    const particles = [];
                    const pGeo = new THREE.SphereGeometry(0.18, 8, 8);
                    const pMat = new THREE.MeshBasicMaterial({color: 0xffea00});

                    // 5. Magnetic Field Rings
                    const fieldRings = new THREE.Group();
                    fieldRings.visible = false; // INVISIBLE UNTIL SWITCH CLOSED
                    const allArrows = [];

                    for(let r=2; r<=6; r+=2) {
                        const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.05, 8, 32), new THREE.MeshBasicMaterial({color: 0x00d2ff}));
                        ring.rotation.x = Math.PI/2;
                        
                        const arr1 = createArrow(new THREE.Vector3(0,0,1), new THREE.Vector3(r,0,0), 1.5, 0x00d2ff);
                        const arr2 = createArrow(new THREE.Vector3(0,0,1), new THREE.Vector3(-r,0,0), 1.5, 0x00d2ff);
                        const arr3 = createArrow(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,r), 1.5, 0x00d2ff);
                        const arr4 = createArrow(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,-r), 1.5, 0x00d2ff);
                        
                        ring.add(arr1, arr2, arr3, arr4);
                        fieldRings.add(ring);
                        allArrows.push(arr1, arr2, arr3, arr4);
                    }
                    activeGroup.add(fieldRings);

                    let I = 10;
                    document.getElementById('slI').addEventListener('input', e => { 
                        I = parseInt(e.target.value); 
                        document.getElementById('valI').textContent = `${Math.abs(I)} A (${I >= 0 ? 'Up' : 'Down'})`; 
                        
                        // Transform Real Hand Image
                        if (I < 0) {
                            handImg.style.transform = "scaleY(-1) scaleX(-1)";
                        } else {
                            handImg.style.transform = "scaleY(1) scaleX(1)";
                        }
                    });

                    // Switch Button Logic
                    switchBtn.addEventListener('click', () => {
                        switchClosed = !switchClosed;
                        if(switchClosed) {
                            switchBtn.innerText = "SWITCH IS CLOSED";
                            switchBtn.classList.add('active');
                            fieldRings.visible = true; // Field appears instantly
                            armPivot.rotation.z = 0; // Close 3D switch physically
                        } else {
                            switchBtn.innerText = "SWITCH IS OPEN";
                            switchBtn.classList.remove('active');
                            fieldRings.visible = false; // Field disappears instantly
                            armPivot.rotation.z = Math.PI / 4; // Open 3D switch physically
                            // Clear existing particles
                            particles.forEach(p => { activeGroup.remove(p.mesh); p.mesh.geometry.dispose(); });
                            particles.length = 0;
                        }
                    });

                    currentAnimation = () => {
                        if(switchClosed && I !== 0) {
                            // Rotate Field Rings (Negative Y rotation is Counter-Clockwise from top)
                            const rotSpeed = I * 0.005;
                            fieldRings.rotation.y -= rotSpeed; 

                            // Update Arrows via Cross Product
                            const currentVector = new THREE.Vector3(0, Math.sign(I), 0);
                            allArrows.forEach(arr => {
                                const pos = arr.position.clone(); 
                                const tangent = new THREE.Vector3().crossVectors(currentVector, pos).normalize();
                                arr.setDirection(tangent);
                            });

                            // Spawn Glowing Particles on Main Wire
                            if(Math.random() < Math.abs(I) * 0.03) {
                                const p = new THREE.Mesh(pGeo, pMat);
                                p.position.set(0, I > 0 ? -4.5 : 10, 0); // Start at battery terminal or top
                                activeGroup.add(p);
                                particles.push({mesh: p, speed: I * 0.015});
                            }

                            // Move and Clean Up Particles
                            for(let i = particles.length - 1; i >= 0; i--) {
                                const p = particles[i];
                                p.mesh.position.y += p.speed;
                                if((I > 0 && p.mesh.position.y > 10) || (I < 0 && p.mesh.position.y < -4.5)) {
                                    activeGroup.remove(p.mesh);
                                    p.mesh.geometry.dispose();
                                    particles.splice(i, 1);
                                }
                            }
                        }
                    };
                }
            },
            laplace: {
                init: () => {
                    // --- UNTOUCHED LAPLACE CODE EXACTLY AS PREVIOUSLY PROVIDED ---
                    uiContent.innerHTML = `
                        <h2>Lorentz Liquid Lab</h2>
                        <div class="formula-box">$$ \\vec{F} = I \\vec{\\ell} \\times \\vec{B} $$</div>
                        <div class="control-group"><label>Current (I): <span id="valI">Up</span></label><input type="range" id="slI" min="-1" max="1" value="1" step="2"></div>
                        <div class="control-group"><label>Magnets (B): <span id="valB">N Left, S Right</span></label><input type="range" id="slB" min="-1" max="1" value="1" step="2"></div>
                    `;
                    safeMathRender();
                    handUI.classList.add('hidden'); 

                    const tank = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), new THREE.MeshPhysicalMaterial({color: 0x0066ff, transmission: 0.9, opacity: 1, transparent: true, roughness: 0.1}));
                    tank.position.y = -1.5; activeGroup.add(tank);

                    const poleN = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matN);
                    const poleS = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matS);
                    activeGroup.add(poleN, poleS);

                    const wirePivot = new THREE.Group(); wirePivot.position.y = 4; activeGroup.add(wirePivot);
                    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6), matCopper);
                    wire.position.y = -3; wirePivot.add(wire);

                    const vGroup = new THREE.Group(); wirePivot.add(vGroup); vGroup.position.y = -1.5;
                    const vecI = createArrow(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 3, 0xffea00);
                    const vecB = createArrow(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 3, 0x00d2ff);
                    const vecF = createArrow(new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,0), 3, 0xff0055);
                    vGroup.add(vecI, vecB, vecF);

                    let I = 1; let B = 1; 
                    
                    document.getElementById('slI').addEventListener('input', e => { 
                        I = parseInt(e.target.value); document.getElementById('valI').textContent = I > 0 ? "Up (+)" : "Down (-)"; 
                    });
                    document.getElementById('slB').addEventListener('input', e => { 
                        B = parseInt(e.target.value); document.getElementById('valB').textContent = B > 0 ? "N Left, S Right" : "S Left, N Right"; 
                    });

                    currentAnimation = () => {
                        poleN.position.set(B > 0 ? -3 : 3, -1.5, 0);
                        poleS.position.set(B > 0 ? 3 : -3, -1.5, 0);

                        const fDir = -1 * I * B; 
                        wirePivot.rotation.x += ((fDir * 0.4) - wirePivot.rotation.x) * 0.1; 

                        vecI.setDirection(new THREE.Vector3(0, I, 0));
                        vecB.setDirection(new THREE.Vector3(B, 0, 0));
                        vecF.setDirection(new THREE.Vector3(0, 0, fDir));
                    };
                }
            }
        };

        // --- Tab Navigation ---
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                scene.remove(activeGroup);
                activeGroup = new THREE.Group();
                scene.add(activeGroup);
                currentAnimation = null;
                camera.position.set(20, 15, 25); controls.target.set(0,0,0);
                modules[e.target.dataset.target].init();
            });
        });

        // Initialize App
        modules['wire'].init();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if(currentAnimation) currentAnimation();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
